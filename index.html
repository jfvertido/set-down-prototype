<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The dim's end color. Installed on the Home Screen, iOS paints the status bar with this once at
         launch, so it stays dark rather than sitting as a lit band above the 60-second dim. -->
    <meta name="theme-color" content="#0a0403" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: installed on the Home Screen, iOS 26+ then reports a viewport 62pt shorter than
         it draws, leaving a dead strip at the bottom, and blurs content under the status bar. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Set Down: a short evening routine for setting the day down before sleep." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Set Down</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
